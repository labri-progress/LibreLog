[project]
name = "LibreLog"
version = "0.1.0"
description = "A log parsing engine."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.13.0",
    "blobfile>=3.2.0",
    "fire>=0.7.1",
    "huggingface-hub>=1.13.0",
    "pandas>=3.0.2",
    "regex>=2026.4.4",
    "scikit-learn>=1.8.0",
    "textdistance>=4.6.3",
    "tiktoken>=0.12.0",
    "torch>=2.11.0",
    "transformers>=5.7.0",
]
